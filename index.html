<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="点検記録">
<title>保安管理 点検記録</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%231769d6'/%3E%3Cpath d='M286 96 166 288h74l-20 128 126-198h-78z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f5f9; --card:#ffffff; --line:#dde4ed; --line2:#eef2f7;
  --text:#1b2430; --muted:#657186; --accent:#1769d6; --accent-weak:#e8f0fc;
  --ok-bg:#e6f6ea; --ok-fg:#166534; --ok-line:#b7e2c3;
  --warn-bg:#fff6da; --warn-fg:#8a5a00; --warn-line:#f0dca4;
  --ng-bg:#fdeaea; --ng-fg:#b3261e; --ng-line:#f3c2bf;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
#app{max-width:680px;margin:0 auto;padding:0 0 96px}
/* ---------- app bar ---------- */
.bar{
  position:sticky;top:0;z-index:30;background:var(--accent);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(16,32,60,.15);
}
.bar h1{font-size:17px;margin:0;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .iconbtn{
  min-width:48px;min-height:48px;border:0;background:rgba(255,255,255,.14);color:#fff;
  border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;padding:0 10px;
}
.bar .iconbtn:active{background:rgba(255,255,255,.28)}
/* ヘッダ＋タブを1つの sticky にまとめる（実機のセーフエリアでもズレない） */
.stickytop{position:sticky;top:0;z-index:30;background:var(--bg);box-shadow:0 2px 6px rgba(16,32,60,.10)}
.stickytop .bar{position:static;box-shadow:none}
/* ---------- layout ---------- */
.wrap{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 12px}
.card.tight{padding:10px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700}
.card h3{font-size:14px;margin:14px 0 8px;font-weight:700;color:#2c3a4d}
/* 既定はスマホ縦画面：1列。560px以上で初めて2列に戻す */
.row{display:flex;flex-direction:column;gap:0}
.row>*{min-width:0}
.row.pair{flex-direction:row;gap:8px}
.row.pair>*{flex:1 1 0}
.field{margin:0 0 10px}
.field label,.lbl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px;font-weight:600}
.in,select,textarea{
  width:100%;min-height:48px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:#fff;color:var(--text);font-size:16px;font-family:inherit;
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8794a6 50%),linear-gradient(135deg,#8794a6 50%,transparent 50%);
  background-position:calc(100% - 18px) 22px,calc(100% - 12px) 22px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px;
  text-overflow:ellipsis}
textarea{min-height:120px;line-height:1.6}
.in:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);
  background:#fff;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
}
.btn:active{background:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:var(--accent-weak);border-color:#cfe0f8;color:#12508f}
.btn.sm{min-height:46px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{color:var(--ng-fg);border-color:var(--ng-line);background:#fff}
/* スマホでは1ボタン1行（細長い横並びを作らない） */
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>.btn{flex:1 1 100%}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.hr{height:1px;background:var(--line2);margin:12px 0}
/* ---------- badge ---------- */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-line)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-line)}
.badge.ng{background:var(--ng-bg);color:var(--ng-fg);border-color:var(--ng-line)}
.badge.na{background:#eef2f7;color:#5a6779;border-color:#dde4ed}
/* ---------- notice ---------- */
.notice{background:#fbfcfe;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.notice b{font-weight:700}
.notice ul{margin:6px 0 0;padding-left:18px}
.notice li{margin:2px 0}
/* ---------- tabs ---------- */
/* スマホ：5タブを1行に均等配置（横スクロールなしで全部見える）。ラベルは略称 */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 12px;background:var(--bg)}
.tab{
  min-height:46px;padding:0 2px;display:flex;align-items:center;justify-content:center;text-align:center;
  border:1px solid var(--line);border-radius:999px;background:#fff;color:#42506a;
  font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;line-height:1.2;
}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tw{display:none} /* 画面が広いときだけ出す語尾 */
/* ---------- list ---------- */
.site{display:flex;gap:8px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 10px}
.site-open{flex:1 1 auto;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;font-size:16px;color:inherit}
.site-del{flex:0 0 48px;min-height:48px;align-self:center;border:1px solid var(--line);background:#fff;border-radius:var(--r);color:var(--ng-fg);font-size:17px;cursor:pointer;font-family:inherit}
.site .t{font-weight:700;font-size:16px}
.site .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.pbar{height:6px;background:var(--line2);border-radius:999px;overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#eef2f7;color:#5a6779;border:1px solid #dde4ed}
.chip.todo{background:var(--ng-bg);color:var(--ng-fg);border-color:var(--ng-line)}
.chip.done{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-line)}
/* ---------- measurement row ---------- */
.item{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:0 0 10px;background:#fff}
.item>.head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item>.head .name{flex:1}
.del{min-width:48px;min-height:48px;border:1px solid var(--line);background:#fff;border-radius:var(--r);color:var(--ng-fg);font-size:18px;cursor:pointer;line-height:1}
/* 判定は現場で一番見たい情報なので枠で囲って目立たせる */
.jslot{margin-top:10px;padding:9px 10px;background:#f6f9fd;border:1px solid var(--line2);border-radius:8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);min-height:34px}
.jslot .badge{font-size:14px;padding:4px 12px}
.jslot .ref{color:var(--muted)}
.prev{font-size:12px;color:#8b95a6}
.check{display:flex;align-items:center;gap:10px;min-height:48px;font-size:14px;cursor:pointer;user-select:none}
.check input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--accent)}
.mrow{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 10px}
.mline{border:1px solid var(--line2);border-radius:8px;padding:8px;background:#fbfcfe}
.mline .t{font-size:13px;font-weight:700;margin-bottom:6px}
.ph{display:flex;gap:8px;align-items:center;margin:0 0 6px}
.ph .pl{flex:0 0 42px;font-size:13px;font-weight:700;color:#42506a}
.ph .in{flex:1}
.unit{flex:0 0 92px}
/* ---------- reference ---------- */
details.ref{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;overflow:hidden}
details.ref>summary{min-height:52px;display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:15px;cursor:pointer;list-style:none}
details.ref>summary::-webkit-details-marker{display:none}
details.ref>summary::after{content:"＋";margin-left:auto;color:var(--accent);font-weight:700}
details.ref[open]>summary::after{content:"−"}
details.ref .body{padding:0 12px 12px;font-size:14px}
details.ref .body p{margin:8px 0}
details.ref .body ul{margin:8px 0;padding-left:20px}
details.ref .body li{margin:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:#f5f8fc;font-weight:700;white-space:nowrap}
.warnbox{border:1px solid var(--ng-line);background:var(--ng-bg);color:#7f2019;border-radius:8px;padding:10px;font-size:13px;margin:8px 0}
.svgwrap{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
.svgwrap svg{display:block;min-width:320px}
/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1;min-height:56px;border:0;background:transparent;color:#6b7686;font-size:11.5px;font-weight:600;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.nav button .ic{font-size:19px;line-height:1}
.nav button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:41;
  min-height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;box-shadow:0 3px 10px rgba(23,105,214,.35);cursor:pointer;font-family:inherit}
/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,26,40,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:680px;border-radius:14px 14px 0 0;padding:16px;max-height:88vh;overflow:auto;
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.modal h2{margin:0 0 12px;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:#1b2430;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .18s;pointer-events:none}
.toast.on{opacity:.96}
/* ---------- コンパクト測定行（スクロールを減らすための1行UI） ---------- */
.crow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;
  padding:5px 0;border-bottom:1px solid var(--line2)}
.crow:last-child{border-bottom:0}
.crow.col{grid-template-columns:1fr auto}
.c-head{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;
  min-width:0;min-height:48px;padding:4px 0;background:none;border:0;color:inherit;
  font-family:inherit;text-align:left;cursor:pointer}
.c-name{font-size:14.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-meta{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-meta::before{content:"▸ "}
.crow.open .c-meta::before{content:"▾ "}
.c-in{display:flex;align-items:center;gap:4px}
.c-in .in{width:86px;text-align:right;padding:10px 8px}
.c-u{font-size:12px;color:var(--muted);min-width:16px}
.c-lines{grid-column:1/-1;padding:0 0 6px}
.c-line{display:flex;align-items:center;gap:6px;margin-top:6px}
.c-line .lab{flex:0 0 40px;font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.c-line .in{flex:0 0 96px;text-align:right;padding:10px 8px}
.c-line .nm{flex:1 1 auto;min-width:0}
/* 入力不可（危険ケーブルの10kV欄など） */
.in:disabled,select:disabled{background:#eef1f6;color:#9aa5b4;-webkit-text-fill-color:#9aa5b4;
  border-style:dashed;cursor:not-allowed;opacity:1}
.c-line.off .lab,.c-line.off .c-u{color:#a6b0be}
.c-off{flex:1 1 auto;font-size:11.5px;color:#8a94a3;line-height:1.25}
.c-warn{font-size:11.5px;color:#b3261e;font-weight:600;line-height:1.35;margin-top:4px}
.tag-danger{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  font-size:10.5px;font-weight:700;background:var(--ng-bg);color:var(--ng-fg);border:1px solid var(--ng-line);vertical-align:1px}
/* 試験種別（年次点検 / 竣工試験）のチップ */
.kindchip{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;
  font-size:11px;font-weight:700;background:#eef2f7;color:#5a6779;border:1px solid #dde4ed;white-space:nowrap}
.kindchip.sk{background:var(--accent-weak);color:#12508f;border-color:#cfe0f8}
/* ---------- 弱点比カード ---------- */
.wcard{padding:12px}
.wtitle{font-size:14px;font-weight:700;margin:0 0 8px}
.wthr{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:1px}
.jslot.wgrid{background:none;border:0;padding:0;margin:0;min-height:0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.wcell{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fbfcfe}
.wside{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wplace{font-weight:400}
.wnum{font-size:30px;font-weight:800;line-height:1.2;letter-spacing:-.5px}
.wsub{font-size:11.5px;font-weight:700;margin-top:1px}
.wtag{font-size:10.5px;font-weight:700;margin-left:8px;padding:2px 8px;border-radius:999px;
  background:#eef2f7;color:#5a6779;border:1px solid #dde4ed;vertical-align:7px}
.wcell.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.wcell.warn .wnum,.wcell.warn .wsub{color:var(--warn-fg)}
.wcell.ng{border-color:var(--ng-line);background:var(--ng-bg)}
.wcell.ng .wnum,.wcell.ng .wsub{color:var(--ng-fg)}
.wcell.na .wnum{font-size:19px;color:#8a94a3;line-height:1.5}
.wnone{font-size:13px;color:var(--muted)}
.jslot.mini{background:none;border:0;padding:0;margin:0;min-height:0;justify-content:flex-end;gap:5px}
.jslot.mini .badge{font-size:12.5px;padding:3px 9px}
.jslot.refonly{background:none;border:0;padding:0;margin:0;min-height:0;display:block;
  font-size:11.5px;color:var(--muted);white-space:normal;line-height:1.35}
/* 整定値の200%値（試験電流）を入力欄の直下に強調表示 */
.jslot.x2{background:none;border:0;margin:0;min-height:0;padding:4px 0 0;display:block;
  color:#b3261e;font-weight:700;font-size:13.5px;line-height:1.2}
.jslot.x2:empty{padding:0}
/* 測定項目のラベル（整定値から都度生成） */
.jslot.labelonly{background:none;border:0;padding:0;margin:0;min-height:0;display:block;
  font-size:inherit;font-weight:inherit;color:inherit;line-height:inherit}
.x2i{display:block;color:#b3261e;font-weight:700;font-size:13px;margin-top:2px}
/* 入力欄の直下に出す弱点比 */
.jslot.wrinline{background:none;border:0;padding:0;margin:0;min-height:0;gap:6px}
.wrv{font-size:17px;font-weight:800;line-height:1.1}
.wrv.ng{color:var(--ng-fg)}
.wrv.warn{color:var(--warn-fg)}
.wrv.na{font-size:13.5px;font-weight:700;color:#8a94a3}
.wrnote{font-size:11px;font-weight:700;color:var(--muted);line-height:1.2}
.wrnote.ng{color:var(--ng-fg)}
.wrnote.warn{color:var(--warn-fg)}
.jslot.wrinline .wtag{vertical-align:1px;margin-left:2px}
.c-det{grid-column:1/-1;padding:10px;margin:2px 0 8px;background:#fbfcfe;border:1px solid var(--line2);border-radius:8px}
.c-det .field:last-child{margin-bottom:0}
.c-det>.jslot{margin-top:0}
.gear{flex:0 0 48px;min-height:48px;border:1px solid var(--line);background:#fff;border-radius:var(--r);
  color:#5a6779;font-size:15px;cursor:pointer;font-family:inherit}
.crow.rel .c-name{white-space:normal;line-height:1.3}
.crow.rel .c-meta{white-space:normal}
.crow.rel{padding:3px 0}
.crow.rel .c-head{min-height:0;padding:1px 0}
.crow.rel .c-name{font-size:13.5px}
.crow.rel .jslot.refonly{line-height:1.25}
/* R相・T相を1行に並べる */
.phrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:1px 0 4px}
.gcell{display:flex;align-items:center;gap:4px;min-width:0}
.gcell .in{flex:1 1 0;min-width:0;text-align:right;padding:10px 7px}
.gl2{flex:0 0 auto;font-size:12px;font-weight:700;color:#42506a}
/* %別 ×（単体／連動）× R/T の表（雛形の列並びに合わせる） */
.gtable{grid-column:1/-1;padding:2px 0 6px}
.grow{display:grid;grid-template-columns:48px repeat(var(--gc,2),1fr);gap:5px;align-items:center;margin-top:5px}
.grow.gh,.grow.gh2{margin-top:2px}
.grow.gh>span,.grow.gh2>span{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center;line-height:1.2}
.grow.gh .gsp{grid-column:span 2;border-bottom:1px solid var(--line2);padding-bottom:1px}
.gl{font-size:12px;font-weight:700;color:#42506a;line-height:1.15}
.gl .amp{display:block;font-style:normal;font-size:10px;font-weight:700;color:#b3261e;background:none;
  border:0;padding:0;margin:0;min-height:0}
.gna{font-size:12px;color:#c3cbd6;text-align:center}
.gtable .gcell .in{padding:10px 5px;font-size:15px}
.gcell.jd{flex-direction:column;align-items:stretch;gap:2px}
.gcell.jd .jslot.mini{justify-content:center}
/* ○×のチェック項目を2列に詰める */
.okhead{font-size:12px;font-weight:700;color:#42506a;margin:12px 0 5px}
.okgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.okcell{display:flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:8px;
  padding:3px 5px;background:#fbfcfe;min-width:0}
.okcell .okl{flex:1 1 auto;min-width:0;font-size:11.5px;font-weight:700;color:#42506a;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.okcell select{flex:0 0 60px;min-height:44px;padding:8px 16px 8px 6px;text-align:center;font-size:15px;
  background-position:calc(100% - 9px) 20px,calc(100% - 5px) 20px}
.btnrow.row2>.btn{flex:1 1 0}
.hrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.hrow h2{flex:1;margin:0}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
/* ---------- 画面が広いとき（横向きスマホ・タブレット・PC）だけ2列に戻す ---------- */
@media (min-width:560px){
  .row{flex-direction:row;gap:8px}
  .row>*{flex:1 1 0}
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{flex:0 0 auto;padding:0 16px;font-size:14px}
  .tw{display:inline}
  .btnrow>.btn{flex:1 1 auto}
  .wrap{padding:14px}
}
@media (min-width:760px){

</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   1. 判定基準（criteria）— 基準改訂はここだけ直せば全画面に反映される
   ========================================================================= */
var CRITERIA = {
  ground: {
    A: 10, C: 10, D: 100,
    fastBreak: 500,           // C種/D種: 0.5秒以内に自動遮断する装置があれば緩和
    elb: 500,                 // D種(ELB): 漏電遮断器(0.5秒以内)付きの緩和値
    aux: 1000,                // 補助極（判定はしないが目安）
    refOnlyKinds: ["AUXP", "AUXC", "STEEL"], // 判定対象外＝参考値のみ（進捗の必須からも除外）
    bBases: { "原則（2秒超 / 制限なし）": 150, "1秒超2秒以内で遮断": 300, "1秒以内で遮断": 600 },
    groundVoltageMax: 10,     // 測定前に確認すべき地電圧
    marginRatio: 0.8          // 基準値の80%を超えたら「余裕なし」と注記（判定は変えない）
  },
  hv: {
    cableG: { ok: 10, warn: 1 },        // ケーブル絶縁体 G方式 [GΩ]
    cableE: { ok: 5, warn: 0.1 },       // ケーブル絶縁体 E方式 [GΩ]（要注意下限は社内運用値）
    sheathE_MO: 1,                      // ケーブルシース E方式 [MΩ]
    busE: { ok: 5, ng: 0.1, weakRatio: 3 } // 母線・機器 E方式 [GΩ] と弱点比
  },
  /* 継電器の判定基準は「種別 × 試験種別」の2階層。
     年次点検＝従来の社内基準、竣工試験＝試験記録雛形（JIS C 4602／メーカー管理値）。
     竣工の定義が無い種別は年次の定義にフォールバックする（RC() 参照）。 */
  relay: {
    OCR: {
      /* testMultiplier: 年次の試験電流倍率（200%）。表示・計算はこの1箇所を参照 */
      "年次点検": { limTol: 10, instTol: 15, testMultiplier: 2.0, testDec: 1,
                    timeTolDefault: 10, instTime: { "連動": 0.1, "単体": 0.05 } },
      /* 竣工＝JIS C 4602。限時の動作時間は300%と700%、瞬時は200%で測る。
         誤差率による自動判定は行わず記録のみ（期待値 (D/10)×T10.3 を計算補助として表示）。*/
      "竣工試験": { limTol: 10, instTol: 15, testDec: 1,
                    limSteps: [150, 200, 300, 500, 700],  // 限時 単体動作時間特性の列
                    cbSteps: [300, 700],                  // 限時 CBとの連動の列
                    t10Steps: [300, 700],                 // 公称動作時間を入力する%
                    stepsRef: [150, 200, 300, 500, 700],  // 試験電流を参考表示する%
                    instStep: 200, instTimeMax: 0.05,     // 瞬時 単体200%で0.05s以下＝良
                    dialBase: 10 }                        // 公称動作時間の基準ダイヤル
    },
    GR:   { "年次点検": { iTol: 10, vTol: 25, testPct: 130, inertiaPct: 400, inertiaSec: 0.05,
                          opTime: { "単体": [0.10, 0.30], "連動": [0.10, 0.40] }, maxSensAngle: 45 } },
    OVR:  { "年次点検": { vTol: 5, resetMinPct: 95,  tTol: 10, stepPct: 120 } },
    UVR:  { "年次点検": { vTol: 5, resetMaxPct: 105, tTol: 10, stepPct: 70 } },
    OVGR: {
      "年次点検": { vTol: 5, resetMinPct: 95, tTol: 5, stepPct: 150 },
      /* 竣工＝メーカー管理値（オムロン）。動作電圧±25%、動作時間は120%/150%で±5%(最小誤差±50ms) */
      "竣工試験": { vTol: 25, tTol: 5, tMinErrSec: 0.05, timeSteps: [120, 150] }
    },
    LGR:  { "年次点検": { typicalSet: 800, actualFrom: 520 } },
    /* RPR/UPR は竣工試験の雛形しか無いため、年次点検でも同じ定義を使う */
    RPR:  { "竣工試験": { basePct: 95,  opTol: 5, judgePhase: 180, phaseSteps: [120, 180, -120],
                          testV: 110, tTol: 10 } },
    UPR:  { "竣工試験": { basePct: 105, opTol: 5, judgePhase: 0,   phaseSteps: [60, 0, -60],
                          testV: 110, tTol: 10, tMinErrSec: 0.05 } }
  },
  lv: {
    classes: { "150V以下": 0.1, "150V超300V以下": 0.2, "300V超": 0.4 }, // [MΩ]
    leakMax: 1.0   // 低圧電路の漏えい電流 [mA]
  }
};
/* 弱点比カードの強調しきい値。ng は判定基準 busE.weakRatio と同じ値を使う（二重管理を避ける） */
CRITERIA.hv.weakDisplay = { warn: 2.5, ng: CRITERIA.hv.busE.weakRatio };
/* 試験種別。既存データ（未設定）は先頭＝年次点検として扱う */
var TEST_KINDS = ["年次点検", "竣工試験"];
/* 基準を共用する種別（DGRはGRの基準をそのまま使う） */
var RELAY_ALIAS = { DGR: "GR" };
function relayCriteria(type) { return CRITERIA.relay[type] || CRITERIA.relay[RELAY_ALIAS[type]] || {}; }
/* 種別×試験種別の基準を引く。竣工の定義が無い種別は年次にフォールバック */
function RC(type, kind) {
  var t = relayCriteria(type);
  return t[kind] || t["年次点検"] || t["竣工試験"] || {};
}
/* その種別に竣工試験専用の様式があるか（雛形が存在するもの） */
function hasShunko(type) { return !!relayCriteria(type)["竣工試験"]; }

/* =========================================================================
   2. 保存 / 汎用ユーティリティ
   ========================================================================= */
var KEY = "hoan.sites.v1";
var db = { sites: [] };
var ui = { screen: "home", siteId: null, tab: "ground", q: "", refJump: null,
           open: {},          // 測定行の詳細を開いているか（行ID → true）
           openHeader: false  // 現場情報カードを開いているか
         };

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); if (o && Array.isArray(o.sites)) { db = o; db.sites.forEach(migrateSite); } }
  } catch (e) { console.warn("load失敗", e); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert("保存に失敗しました（容量超過の可能性）: " + e.message); }
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function today() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
function num(v) { if (v === undefined || v === null) return NaN; var s = String(v).trim(); if (s === "") return NaN; return Number(s); }
function has(v) { return !isNaN(num(v)); }
function fmt(n, d) { if (n === null || n === undefined || isNaN(n)) return "—"; if (d === undefined) d = 2;
  var s = Number(n).toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s; }
function esc(s) { return String(s === undefined || s === null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("on"); }, 1800); }
function badge(s) {
  var map = { ok: ["ok", "良"], warn: ["warn", "要注意"], ng: ["ng", "不良"], na: ["na", "—"], ref: ["na", "参考値"] };
  var m = map[s] || map.na; return '<span class="badge ' + m[0] + '">' + m[1] + "</span>";
}
function rangeText(a, b, u, d) { return fmt(a, d) + " 〜 " + fmt(b, d) + (u || ""); }
function inRange(v, a, b) { return v >= a - 1e-12 && v <= b + 1e-12; }
function judgeRange(v, a, b) { if (isNaN(v) || isNaN(a) || isNaN(b)) return "na"; return inRange(v, a, b) ? "ok" : "ng"; }
function pick(o, path) { var p = path.split("."), c = o; for (var i = 0; i < p.length; i++) { if (c == null) return undefined; c = c[p[i]]; } return c; }
function put(o, path, val) { var p = path.split("."), c = o;
  for (var i = 0; i < p.length - 1; i++) { if (typeof c[p[i]] !== "object" || c[p[i]] === null) c[p[i]] = {}; c = c[p[i]]; }
  c[p[p.length - 1]] = val; }

/* =========================================================================
   3. データモデル
   ========================================================================= */
var GROUND_KINDS = [
  { k: "A", label: "A種" }, { k: "B", label: "B種" }, { k: "C", label: "C種" }, { k: "D", label: "D種" },
  { k: "DELB", label: "D種(ELB)" }, { k: "PAS", label: "PAS（A種扱い）" },
  { k: "AUXP", label: "補助極(P)（参考値）" }, { k: "AUXC", label: "補助極(C)（参考値）" },
  { k: "STEEL", label: "鉄骨（参考値）" }, { k: "LA", label: "LA避雷器（A種扱い）" }
];
/* 新規現場の既定行。この順で並ぶ */
var GROUND_TEMPLATE = [
  { name: "A種", kind: "A" }, { name: "B種", kind: "B" }, { name: "C種", kind: "C" },
  { name: "D種", kind: "D" }, { name: "D種(ELB)", kind: "DELB" }, { name: "PAS", kind: "PAS" },
  { name: "補助極(P)", kind: "AUXP" }, { name: "補助極(C)", kind: "AUXC" }, { name: "鉄骨", kind: "STEEL" }
];
function isRefKind(k) { return CRITERIA.ground.refOnlyKinds.indexOf(k) >= 0; }
var SITE_TYPES = ["月次", "年次", "竣工"];
var RELAY_TYPES = ["OCR", "GR", "DGR", "OVR", "UVR", "OVGR", "RPR", "UPR", "LGR"];
var CATS = { ground: "接地抵抗", hv: "高圧絶縁", relay: "継電器", lv: "低圧絶縁・漏洩", memo: "自由メモ" };
var TEMPLATES = { "月次": ["lv", "memo"], "年次": ["ground", "hv", "relay", "lv"], "竣工": ["ground", "hv", "relay", "lv", "memo"] };

function newGround(name, kind) {
  return { id: uid(), name: name || "", kind: kind || "A", value: "", method: "3極法", gv: "", note: "",
           fast: false, bCap: "", bBaseLabel: "", bBase: "", bIg: "", bManual: "" };
}
function defaultGround() { return GROUND_TEMPLATE.map(function (t) { return newGround(t.name, t.kind); }); }
function newHv(place, method, side) {
  return { id: uid(), place: place, method: method, side: side, value: "", v10: "", unit: "GΩ",
           leak: false, danger: false, wrManual: "", note: "" };
}
/* 高圧絶縁の標準3測定（負荷側E → 電源側G → 電源側E の順）。
   電源側で測っているのは機器・母線なので、判定は「母線・機器」の基準を使う */
function defaultHv() {
  return [newHv("bus", "E", "負荷側"), newHv("bus", "G", "電源側"), newHv("bus", "E", "電源側")];
}
/* B種接地線のクランプ測定（Igr）。電灯・動力トランス別に行を足せる */
function newClamp(name) { return { id: uid(), name: name || "", io: "", igr: "", note: "" }; }
function newSite(name) {
  return {
    id: uid(), name: name || "", voltage: "6600V", date: today(), type: "年次",
    testKind: TEST_KINDS[0], created: Date.now(),
    ground: defaultGround(), hv: defaultHv(), relays: [], lv: [],
    bClamp: [newClamp("電灯トランス"), newClamp("動力トランス")], memo: ""
  };
}
function newRelay(type) { return { id: uid(), type: type, label: "", note: "", byKind: {} }; }
/* 継電器の整定値・測定値は試験種別ごとに分けて持つ。切り替えても互いを壊さない */
function relayStore(r, kind) {
  if (!r.byKind) r.byKind = {};
  if (!r.byKind[kind]) r.byKind[kind] = { s: {}, m: {} };
  var st = r.byKind[kind];
  if (!st.s) st.s = {};
  if (!st.m) st.m = {};
  return st;
}
function testKind(s) { return (s && TEST_KINDS.indexOf(s.testKind) >= 0) ? s.testKind : TEST_KINDS[0]; }
/* 旧データの補完。スキーマを増やしたら必ずここで既定値を埋める。
   既存の測定値は決して書き換えない（不足フィールドを足すだけ）。 */
function migrateSite(s) {
  // bClamp: 単一オブジェクト → 配列
  if (s.bClamp && !Array.isArray(s.bClamp)) {
    var b = s.bClamp;
    s.bClamp = [{ id: uid(), name: "B種接地線", io: b.io || "", igr: b.igr || "", note: b.note || "" }];
  }
  if (!Array.isArray(s.bClamp)) s.bClamp = [newClamp("電灯トランス"), newClamp("動力トランス")];
  s.bClamp.forEach(function (c) { if (!c.id) c.id = uid(); });

  // 接地：id・種別の既定値を補完（既存の kind はそのまま活かす）
  if (!Array.isArray(s.ground)) s.ground = [];
  s.ground.forEach(function (r) {
    if (!r.id) r.id = uid();
    if (!r.kind) r.kind = "A";
    if (r.fast === undefined) r.fast = false;
    if (r.method === undefined) r.method = "3極法";
  });

  // 高圧：10kV欄・危険ケーブルフラグ・単位を補完
  if (!Array.isArray(s.hv)) s.hv = [];
  s.hv.forEach(function (r) {
    if (!r.id) r.id = uid();
    if (r.v10 === undefined) r.v10 = "";
    if (r.danger === undefined) r.danger = false;   // 危険ケーブル（5kVまで）
    if (!r.unit) r.unit = "GΩ";
    if (r.wrManual === undefined) r.wrManual = "";
    if (r.leak === undefined) r.leak = false;
  });

  if (!Array.isArray(s.lv)) s.lv = [];
  s.lv.forEach(function (r) { if (!r.id) r.id = uid(); });
  // 試験種別。未設定の既存データは年次点検として扱う
  if (TEST_KINDS.indexOf(s.testKind) < 0) s.testKind = TEST_KINDS[0];

  // 継電器：旧形式（s/m を直持ち）を byKind["年次点検"] へ退避。値は保持したまま移すだけ
  if (!Array.isArray(s.relays)) s.relays = [];
  s.relays.forEach(function (r) {
    if (!r.id) r.id = uid();
    if (!r.byKind) r.byKind = {};
    if (r.s || r.m) {
      var old = r.byKind[TEST_KINDS[0]] || {};
      r.byKind[TEST_KINDS[0]] = { s: r.s || old.s || {}, m: r.m || old.m || {} };
      delete r.s; delete r.m;
    }
    TEST_KINDS.forEach(function (k) { relayStore(r, k); });
    if (r.note === undefined) r.note = "";
  });
  return s;
}
function site() { for (var i = 0; i < db.sites.length; i++) if (db.sites[i].id === ui.siteId) return db.sites[i]; return null; }
function sortedSites() {
  return db.sites.slice().sort(function (a, b) {
    var d = String(b.date || "").localeCompare(String(a.date || "")); if (d !== 0) return d;
    return (b.created || 0) - (a.created || 0);
  });
}
function prevSite(s) {
  var c = db.sites.filter(function (x) {
    return x.id !== s.id && x.name && x.name === s.name && x.date && (!s.date || x.date < s.date);
  }).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  return c[0] || null;
}

/* ---- 進捗（チェックリスト） ---- */
function catFilled(s, c) {
  /* 参考値のみの行（補助極・鉄骨）は必須項目に数えない */
  if (c === "ground") return s.ground.some(function (r) { return !isRefKind(r.kind) && has(r.value); });
  if (c === "hv") return s.hv.some(function (r) { return has(r.value) || has(r.v10); });
  if (c === "relay") return s.relays.length > 0;
  if (c === "lv") return s.lv.some(function (r) { return has(r.ir) || has(r.leak); }) ||
    (s.bClamp || []).some(function (b) { return has(b.igr) || has(b.io); });
  if (c === "memo") return !!(s.memo && s.memo.trim());
  return false;
}
function progress(s) {
  var req = TEMPLATES[s.type] || TEMPLATES["年次"];
  var done = req.filter(function (c) { return catFilled(s, c); });
  return { req: req, done: done, pct: req.length ? Math.round(done.length / req.length * 100) : 0 };
}

/* =========================================================================
   4. 判定ロジック
   ========================================================================= */
/* ---- 4.1 接地抵抗 ---- */
function bLimit(r) {
  if (has(r.bManual)) return num(r.bManual);
  var base = num(r.bBase), ig = num(r.bIg);
  if (!isNaN(base) && !isNaN(ig) && ig > 0) return base / ig;
  return NaN;
}
function judgeGround(r) {
  var v = num(r.value), k = r.kind, limit = NaN, ref = "";
  if (isRefKind(k)) {
    return { s: "ref", ref: k === "STEEL" ? "判定対象外（参考値として記録）"
      : "判定対象外（参考値。補助極は " + CRITERIA.ground.aux + "Ω以下が望ましい）" };
  }
  if (k === "A" || k === "PAS" || k === "LA") { limit = CRITERIA.ground.A; ref = CRITERIA.ground.A + "Ω以下"; }
  else if (k === "DELB") { limit = CRITERIA.ground.elb; ref = CRITERIA.ground.elb + "Ω以下（ELB付き）"; }
  else if (k === "C") { limit = r.fast ? CRITERIA.ground.fastBreak : CRITERIA.ground.C;
    ref = r.fast ? CRITERIA.ground.fastBreak + "Ω以下（0.5秒以内遮断）" : CRITERIA.ground.C + "Ω以下"; }
  else if (k === "D") { limit = r.fast ? CRITERIA.ground.fastBreak : CRITERIA.ground.D;
    ref = r.fast ? CRITERIA.ground.fastBreak + "Ω以下（0.5秒以内遮断）" : CRITERIA.ground.D + "Ω以下"; }
  else if (k === "B") { limit = bLimit(r); ref = isNaN(limit) ? "基準値未設定（容量・地絡電流・遮断時間を入力）" : fmt(limit, 2) + "Ω以下"; }
  if (isNaN(limit) || isNaN(v)) return { s: "na", ref: ref, limit: limit };
  var s = v <= limit ? "ok" : "ng";
  var note = (s === "ok" && v > limit * CRITERIA.ground.marginRatio) ? "基準値の80%超（余裕なし）" : "";
  return { s: s, ref: ref, limit: limit, note: note };
}

/* ---- 4.2 高圧絶縁抵抗（3線一括のみ／E方式は5kV・10kVの2点） ---- */
var HV_PLACES = [["cable", "ケーブル絶縁体"], ["bus", "母線・機器"], ["sheath", "ケーブルシース"]];
function placeLabel(p) { var f = HV_PLACES.filter(function (x) { return x[0] === p; })[0]; return f ? f[1] : p; }
function hvVal(r, w) { return w === "v10" ? r.v10 : r.value; }
function hvKvLabel(w) { return w === "v10" ? "10kV" : "5kV"; }
function toGO(r, w) { var v = num(hvVal(r, w)); if (isNaN(v)) return NaN; return r.unit === "MΩ" ? v / 1000 : v; }
function toMO(r, w) { var v = num(hvVal(r, w)); if (isNaN(v)) return NaN; return r.unit === "MΩ" ? v : v * 1000; }
function hvGroupKey(r) { return r.place + "|" + r.method + "|" + r.side; }
/* 判定の重い方を採る（未測定 < 良 < 要注意 < 不良） */
function worst(a, b) { var o = { na: 0, ok: 1, warn: 2, ng: 3 }; return (o[a] || 0) >= (o[b] || 0) ? a : b; }
/* 弱点比＝同じ測定点における 5kV値 と 10kV値 の比（大きい方 ÷ 小さい方）。
   電源側は電源側の5kV/10kV、負荷側は負荷側の5kV/10kVで取る。
   印加電圧を上げたときの落ち込みが大きいほど絶縁の弱点が疑われる。 */
/* 危険ケーブル＝5kVを超える電圧を印加してはならない。10kVを測れないので弱点比は算出不可。
   対象はケーブルのG方式・E方式のみ（測定箇所を変えた場合はフラグを無効扱いにする） */
function dangerOn(r) { return !!r.danger && r.place === "cable"; }
function weakRatio(s, r) {
  if (has(r.wrManual)) return num(r.wrManual);
  if (dangerOn(r)) return NaN;                 // 10kVを印加しないので比が取れない
  var a = toGO(r, "v5"), b = toGO(r, "v10");
  if (isNaN(a) || isNaN(b) || !(a > 0) || !(b > 0)) return NaN;
  return Math.max(a, b) / Math.min(a, b);
}

      return { k: "t10_" + p, l: "公称動作時間 T" + KO.dialBase + "." + (p / 100) + " [s]（ダイヤル" + KO.dialBase + "・" + p + "%）" };
    })).concat([
      { k: "tester", l: "試験器 機器名", text: true }, { k: "testerMaker", l: "試験器 製造者", text: true },
      { k: "testerModel", l: "試験器 型式", text: true }, { k: "testerRange", l: "試験器 定格 [0〜A]", text: true }
    ]);
  }
  if (t === "OVGR" && shunko) return nameplateFields().concat([
    { k: "tapPct", l: "タップ [%]" }, { k: "setT", l: "ダイヤル(L) 時限 [s]" },
    { k: "setV", l: "動作電圧 整定 [V]（判定用）" }
  ]);
  if (t === "OCR") return [
    { k: "tap", l: "限時タップ [A]", x2: true }, { k: "lever", l: "レバー" },
    { k: "inst", l: "瞬時整定 [A]", x2: true },
    { k: "time", l: "時限 [s]" }, { k: "ct", l: "CT比", text: true },
    { k: "link", l: "連動 / 単体", sel: ["連動", "単体"] },
    { k: "timeBase", l: "限時動作時間 基準値 [s]（特性表）" }, { k: "timeTol", l: "同 許容 [±%]" }
  ];
  if (t === "GR") return [
    { k: "i0", l: "零相動作電流 I0 [A]（標準0.2）" }, { k: "opt", l: "動作時間整定 [s]（標準0.2）" },
    { k: "link", l: "連動 / 単体", sel: ["連動", "単体"] }
  ];
  if (t === "DGR") return [
    { k: "i0", l: "零相動作電流 I0 [A]（標準0.2）" }, { k: "v0", l: "零相動作電圧 V0 [V]（標準5%）" },
    { k: "opt", l: "動作時間整定 [s]（標準0.2）" }, { k: "link", l: "連動 / 単体", sel: ["連動", "単体"] },
    { k: "phLeadMin", l: "位相 進み側 下限 [°]" }, { k: "phLeadMax", l: "位相 進み側 上限 [°]" },
    { k: "phLagMin", l: "位相 遅れ側 下限 [°]" }, { k: "phLagMax", l: "位相 遅れ側 上限 [°]" }
  ];
  if (t === "OVR" || t === "UVR" || t === "OVGR") return [
    { k: "setV", l: "電圧整定 [V]" }, { k: "setT", l: "時間整定 [s]" }, { k: "tap", l: "タップ", text: true }
  ];
  if (t === "LGR") return [{ k: "setI", l: "整定 [mA]（一般に800）" }];
  return [];
}
function relayTitleShort(t) { return (relayTitle(t).split(/[（/]/)[0] || t).trim(); }

/* ---- 4.4 低圧 ---- */
function judgeLv(r) {
  var lim = CRITERIA.lv.classes[r.cls];
  var v = num(r.ir), ref = r.cls + "：" + lim + "MΩ以上";
  if (isNaN(v) || lim === undefined) return { s: "na", ref: ref };
  return { s: v >= lim ? "ok" : "ng", ref: ref };
}
function judgeLeak(v) {
  var x = num(v); if (isNaN(x)) return { s: "na", ref: CRITERIA.lv.leakMax + "mA以下" };
  return { s: x <= CRITERIA.lv.leakMax ? "ok" : "ng", ref: CRITERIA.lv.leakMax + "mA以下" };
}

/* ---- 5.1 ホーム ---- */

    }).join("");

/* ---- 5.2 現場詳細 ---- */

/* ---- 接地抵抗タブ（1行=1項目。詳細は行タップで展開） ---- */

      '<div class="field"><label>1線地絡電流 I [A]</label><input class="in" inputmode="decimal" data-bind="ground:' + r.id + ':bIg" value="' + esc(r.bIg) + '"></div>' +
      '<div class="field"><label>基準値 手入力 [Ω]（優先）</label><input class="in" inputmode="decimal" data-bind="ground:' + r.id + ':bManual" value="' + esc(r.bManual) + '"></div>' +
      "</div>";

  return '<div class="field"><label>項目名</label><input class="in" data-bind="ground:' + r.id + ':name" value="' + esc(r.name) + '" placeholder="項目名"></div>' +

}

/* ---- 高圧絶縁タブ（3線一括のみ／E方式は5kV・10kVの2点） ---- */
function hvLine(r, w) {
  var field = (w === "v10") ? "v10" : "value";
  var off = (w === "v10") && dangerOn(r);   // 危険ケーブルは10kVを印加しない
  return '<div class="c-line' + (off ? " off" : "") + '"><span class="lab">' + hvKvLabel(w) + "</span>" +
    '<input class="in" inputmode="decimal"' + (off ? " disabled" : "") +
      ' data-bind="hv:' + r.id + ":" + field + '" value="' + esc(hvVal(r, w)) + '">' +
    '<span class="c-u">' + esc(r.unit) + "</span>" +
    (off ? '<span class="c-off">危険ケーブルのため5kVまで</span>'

    "</div>";
}

      '<div class="field"><label>方式</label><select data-bind="hv:' + r.id + ':method">' +

    '<div class="field"><label>単位</label><select data-bind="hv:' + r.id + ':unit">' +

    '<div class="muted small" style="margin-bottom:6px">' + sideHint + "（測定は3線一括）</div>" +
    (r.place === "cable" ?
      '<label class="check"><input type="checkbox" data-bind="hv:' + r.id + ':danger"' + (r.danger ? " checked" : "") +

    (r.place === "bus" ? '<div class="field"><label>弱点比 手入力（自動算出を上書き）</label><input class="in" inputmode="decimal" data-bind="hv:' + r.id + ':wrManual" value="' + esc(r.wrManual) + '"></div>' : "") +
    '<div class="field"><label>備考</label><input class="in" data-bind="hv:' + r.id + ':note" value="' + esc(r.note) + '"></div>' +
    '<div class="jslot" data-jslot="hv:' + r.id + ':full"></div>' +

}
function tabHv(s, prev) {
  var rows = s.hv.map(function (r) {
    var open = !!ui.open[r.id];
    var lines = r.method === "E" ? (hvLine(r, "v5") + hvLine(r, "v10"))
      : ('<div class="c-line"><span class="lab">測定値</span>' +
         '<input class="in" inputmode="decimal" data-bind="hv:' + r.id + ':value" value="' + esc(r.value) + '">' +
         '<span class="c-u">' + esc(r.unit) + "</span>" +
         '<span class="jslot mini" data-jslot="hv:' + r.id + ':v5" style="flex:1 1 auto"></span></div>');
    // 弱点比は入力欄のすぐ下でも確認できるようにする（上部カードと同じ値）
    if (r.method === "E" && r.place !== "sheath") {
      lines += '<div class="c-line"><span class="lab">弱点比</span>' +
        '<span class="jslot wrinline" data-jslot="hv:' + r.id + ':wr" style="flex:1 1 auto"></span></div>';
    }
    // 危険ケーブル指定後も既存の10kV値は破棄しない。判定から外していることを明示する

          (dangerOn(r) ? '<span class="tag-danger">危険ケーブル</span>' : "") + "</span>" +
        '<span class="c-meta">' + esc(placeLabel(r.place)) + " / 3線一括" + (r.leak ? " / リーク音あり" : "") + "</span>" +
      "</button>" +
      '<span class="jslot mini" data-jslot="hv:' + r.id + '"></span>' +

  }).join("");
  return '<div class="card wcard">' +
      '<div class="wtitle">弱点比（5kV ÷ 10kV）<span class="wthr">' +

      '<div class="jslot wgrid" data-jslot="weak"></div>' +
    "</div>" +
    '<div class="card">' +

    relayItems(r, kind).forEach(function (it) {

      if (it.ok) {

        okBuf.push('<div class="okcell"><span class="okl">' + esc(it.label) + "</span>" +

          "</select></div>");

      }
      flushOk();
      if (it.type === "grid") {   // %別 ×（単体／連動）×（R相／T相）の表
        var cols = it.cols, ncol = cols.length * 2;
        items += '<div class="crow rel col">' + head(it) +
          '<div class="gtable" style="--gc:' + ncol + '">' +
          '<div class="grow gh"><span></span>' +
            cols.map(function (c) { return '<span class="gsp">' + esc(c.l) + "</span>"; }).join("") + "</div>" +
          '<div class="grow gh2"><span></span>' +
            cols.map(function () { return "<span>R</span><span>T</span>"; }).join("") + "</div>" +
          it.rows.map(function (row) {
            return '<div class="grow"><span class="gl">' + esc(row.l) +
              (row.ampKey ? '<i class="jslot amp" data-jslot="relay:' + r.id + ":amp." + row.ampKey + "." + row.ampPct + '"></i>' : "") +
              "</span>" +
              cols.map(function (c) {

                return ["R", "T"].map(function (p) {

                  return '<div class="gcell' + (c.judge ? " jd" : "") + '">' +

    var setEmpty = relaySettingFields(r.type, kind).every(function (f) {

    return '<div class="card">' +

  }).join("");
  var noTemplate = s.relays.filter(function (r) { return kind === "竣工試験" && !hasShunko(r.type); })
    .map(function (r) { return relayTitleShort(r.type); });
  /* 測定欄を先に出したいので、見出し・追加UI・注記はタブの最後に置く

      '<div class="hrow"><h2>継電器試験</h2>' +
        '<span class="kindchip ' + (kind === "竣工試験" ? "sk" : "") + '">' + esc(kind) + "</span></div>" +
      '<div class="muted small" style="margin-bottom:8px">' +
        (kind === "竣工試験" ? "竣工試験の様式（JIS C 4602／メーカー管理値）で表示中。" :
          "判定基準は 限時=±" + CRITERIA.relay.OCR["年次点検"].limTol + "%、瞬時=±" + CRITERIA.relay.OCR["年次点検"].instTol + "%。") +
        "</div>" +
      (noTemplate.length ? '<div class="notice">' + esc(noTemplate.join("・")) +
        " は竣工試験の記録雛形が無いため、年次点検と同じ項目で表示しています。</div>" : "") +
      '<div class="row"><div class="field"><label>継電器を追加</label><select id="relayAdd">' +
        RELAY_TYPES.map(function (t) { return '<option value="' + t + '">' + esc(relayTitle(t)) + "</option>"; }).join("") +
        "</select></div></div>" +

/* =========================================================================
   6. 判定スロットの更新（入力のフォーカスを壊さないため部分更新）
   ========================================================================= */
function prevLine(pv, unit, higherBetter) {
  if (pv === undefined || pv === null || String(pv).trim() === "") return "";
  return '<span class="prev">前回 ' + esc(pv) + (unit || "") + "</span>";
}
function trendMark(cur, prev, higherBetter) {
  var a = num(cur), b = num(prev);
  if (isNaN(a) || isNaN(b) || b === 0) return "";
  if (Math.abs(a - b) / Math.abs(b) < 0.05) return "→ 横ばい";
  var up = a > b;
  return up ? "↑ 上昇" + (higherBetter ? "（改善）" : "（悪化）") : "↓ 低下" + (higherBetter ? "（悪化）" : "（改善）");
}
function refreshJudge() {
  var s = site(); if (!s || ui.screen !== "site") return;
  var prev = prevSite(s);
  var slots = app.querySelectorAll("[data-jslot]");
  for (var i = 0; i < slots.length; i++) {
    var el = slots[i];
    var mode = el.classList.contains("mini") ? "mini" : (el.classList.contains("refonly") ? "ref" : "full");
    el.innerHTML = slotHtml(s, prev, el.getAttribute("data-jslot").split(":"), mode);
  }
}
function slotHtml(s, prev, key, mode) {
  var cat = key[0], id = key[1], sub = key[2];
  if (cat === "ground") {
    var r = s.ground.filter(function (x) { return x.id === id; })[0]; if (!r) return "";
    var j = judgeGround(r);
    if (mode === "mini") return badge(j.s);
    var pv = prev ? (prev.ground.filter(function (x) { return x.name === r.name; })[0] || {}).value : null;
    var gv = num(r.gv), gvw = (!isNaN(gv) && gv > CRITERIA.ground.groundVoltageMax) ?
      '<span class="prev">⚠ 地電圧が' + CRITERIA.ground.groundVoltageMax + "Vを超過</span>" : "";
    return badge(j.s) + '<span class="ref">基準：' + esc(j.ref) + "</span>" +
      (j.note ? '<span class="prev">⚠ ' + esc(j.note) + "</span>" : "") + gvw +
      (pv ? prevLine(pv, "Ω") + '<span class="prev">' + trendMark(r.value, pv, false) + "</span>" : "");
  }
  if (cat === "hv") {
    var h = s.hv.filter(function (x) { return x.id === id; })[0]; if (!h) return "";
    if (sub === "v5" || sub === "v10") {
      var jw = judgeHv(s, h, sub);
      return badge(jw.s) + (mode === "mini" ? "" : '<span class="ref">基準：' + esc(jw.ref) + "</span>");
    }
    if (sub === "wr") {   // 入力欄の直下に出す弱点比
      var D0 = CRITERIA.hv.weakDisplay, wv = weakRatio(s, h);
      if (dangerOn(h) && !has(h.wrManual))
        return '<span class="wrv na">算出不可</span><span class="wrnote">危険ケーブル（5kVのみ）</span>';
      if (isNaN(wv))
        return '<span class="wrv na">—</span><span class="wrnote">5kVと10kVの両方を入力</span>';
      var wc = wv >= D0.ng ? "ng" : (wv >= D0.warn ? "warn" : "");
      return '<span class="wrv ' + wc + '">' + fmt(wv, 2) + "</span>" +
        (wc ? '<span class="wrnote ' + wc + '">' + (wc === "ng" ? D0.ng + "以上：弱点あり" : D0.warn + "以上：要観察") + "</span>" : "") +
        (has(h.wrManual) ? '<span class="wtag">手入力</span>' : "");
    }
    if (mode === "mini") return badge(hvOverall(s, h));   // 行見出しの総合判定
    // 展開時のフル表示
    var out = "", ws = hvSteps(h);
    ws.forEach(function (w) {
      var jj = judgeHv(s, h, w);
      out += "<span>" + (h.method === "E" ? hvKvLabel(w) + " " : "") + badge(jj.s) + "</span>";
    });
    if (h.method === "E" && h.place !== "sheath") {
      var wrr = weakRatio(s, h);
      out += '<span class="prev">弱点比（5kV÷10kV）' +
        (dangerOn(h) && !has(h.wrManual) ? "算出不可（5kVのみ）"
          : (isNaN(wrr) ? "—" : fmt(wrr, 2) + (has(h.wrManual) ? "（手入力）" : "（自動）"))) + "</span>";
    }
    var jr = judgeHv(s, h, "v5");
    out += '<span class="ref">基準：' + esc(jr.ref) + "</span>";
    if (jr.note) out += '<span class="prev">⚠ ' + esc(jr.note) + "</span>";
    if (prev) {
      var mt = prev.hv.filter(function (x) { return hvGroupKey(x) === hvGroupKey(h); })[0];
      if (mt && has(mt.value)) out += prevLine(mt.value + (mt.unit || ""), "") +
        '<span class="prev">' + trendMark(h.value, mt.value, true) + "</span>";
    }
    return out;
  }
  if (cat === "lv") {
    var l = s.lv.filter(function (x) { return x.id === id; })[0]; if (!l) return "";
    var jl = judgeLv(l), jk = judgeLeak(l.leak);
    if (mode === "mini") return badge(worst(jl.s, jk.s));
    var pl = prev ? (prev.lv.filter(function (x) { return x.name === l.name; })[0] || {}).ir : null;
    return "<span>絶縁 " + badge(jl.s) + "</span><span>漏えい " + badge(jk.s) + "</span>" +
      '<span class="ref">' + esc(jl.ref) + " ／ 漏えい " + esc(jk.ref) + "</span>" +
      (pl ? prevLine(pl, "MΩ") + '<span class="prev">' + trendMark(l.ir, pl, true) + "</span>" : "");
  }
  if (cat === "bclamp") {
    var bc = (s.bClamp || []).filter(function (x) { return x.id === id; })[0]; if (!bc) return "";
    var jb = judgeLeak(bc.igr);
    if (mode === "mini") return badge(jb.s);
    var pb = prev ? ((prev.bClamp || []).filter(function (x) { return x.name === bc.name; })[0] || {}).igr : null;
    return badge(jb.s) + '<span class="ref">Igr 基準：' + esc(jb.ref) + "</span>" +
      (has(bc.io) ? '<span class="prev">Io ' + esc(bc.io) + "mA</span>" : "") +
      (pb ? prevLine(pb, "mA") + '<span class="prev">' + trendMark(bc.igr, pb, false) + "</span>" : "");
  }
  if (cat === "weak") {
    var es = s.hv.filter(function (x) { return x.method === "E" && x.place !== "sheath"; });
    if (!es.length) return '<div class="wnone">E方式の測定がありません</div>';
    var D = CRITERIA.hv.weakDisplay;
    return es.map(function (x) {
      var wr = weakRatio(s, x), cls = "", val, sub = "";
      if (dangerOn(x) && !has(x.wrManual)) { cls = "na"; val = "算出不可"; sub = "危険ケーブル（5kVのみ）"; }
      else if (isNaN(wr)) { cls = "na"; val = "—"; sub = "5kVと10kVの両方を入力"; }
      else {
        val = fmt(wr, 2);
        if (wr >= D.ng) { cls = "ng"; sub = D.ng + "以上：弱点あり"; }
        else if (wr >= D.warn) { cls = "warn"; sub = D.warn + "以上：要観察"; }
      }
      return '<div class="wcell ' + cls + '">' +
        '<div class="wside">' + esc(x.side) + ' <span class="wplace">' + esc(placeLabel(x.place)) + "</span></div>" +
        '<div class="wnum">' + val + (has(x.wrManual) ? '<span class="wtag">手入力</span>' : "") + "</div>" +
        (sub ? '<div class="wsub">' + esc(sub) + "</div>" : "") +
        "</div>";
    }).join("");
  }
  if (cat === "relay") {
    var r2 = s.relays.filter(function (x) { return x.id === id; })[0]; if (!r2) return "";
    var rkind = testKind(s), rst = relayStore(r2, rkind);
    // 整定値の200%値（表示専用。保存はしない）
    if (sub && sub.indexOf("x2.") === 0) {
      var base = num(pick(rst.s, sub.slice(3)));
      if (isNaN(base)) return "";
      return ocrPct() + "% = " + ocrX2(base) + "A";
    }
    // 竣工OCR：整定値欄の直下に各%の試験電流を一覧表示
    if (sub && sub.indexOf("steps.") === 0) {
      var sk = sub.slice(6), sbase = num(pick(rst.s, sk)), KS = RC(r2.type, rkind);
      if (isNaN(sbase) || !KS.stepsRef) return "";
      return KS.stepsRef.map(function (p) { return p + "% = " + stepAmp(sbase, p) + "A"; }).join(" ／ ");
    }
    // 表の行見出しに出す試験電流（amp.<整定キー>.<%>）
    if (sub && sub.indexOf("amp.") === 0) {
      var ap = sub.split("."), ab = num(pick(rst.s, ap[1]));
      return isNaN(ab) ? "" : stepAmp(ab, Number(ap[2])) + "A";
    }
    // 測定項目のラベル。200%値は測定入力欄の側にも赤字で出す
    if (sub && sub.indexOf("lb.") === 0) {
      var lk = sub.slice(3);
      var li = relayItems(r2, rkind).filter(function (x) { return x.key === lk; })[0];
      if (!li) return "";
      var lo = esc(li.label);
      if (li.x2key) {
        var bv = num(pick(rst.s, li.x2key));
        lo += '<span class="x2i">整定' + ocrPct() + "% = " + (isNaN(bv) ? "—" : ocrX2(bv)) + "A で試験</span>";
      }
      return lo;
    }
    var items = relayItems(r2, rkind);
    // 相付き（key末尾がR/T）のセルか、項目全体か
    var base = sub, phase = "", cellJudge = null;
    var it = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].key === sub) { it = items[i]; break; }
      if (items[i].phases && (items[i].key + "R" === sub || items[i].key + "T" === sub)) {
        it = items[i]; phase = sub.slice(-1); base = items[i].key; break;
      }
      if (items[i].type === "grid") {   // 表のセル：key + 列 + 行 + 相
        var g = items[i], hit = null;
        g.cols.forEach(function (c) {
          g.rows.forEach(function (row) {
            ["R", "T"].forEach(function (p) {
              if (g.key + c.k + row.k + p === sub) hit = c;
            });
          });
        });
        if (hit) { it = g; phase = sub.slice(-1); base = sub.slice(0, -1); cellJudge = hit.judge || null; break; }
      }
    }
    if (!it) return "";
    if (phase) {
      var v = num(pick(rst.m, base + phase));
      var jf = cellJudge || (it.type === "grid" ? null : it.judge);
      return jf ? badge(jf(v)) : "";
    }
    if (mode === "ref") return "基準：" + it.ref;   // 見出し下の基準テキスト
    if (it.type === "select") {
      var cv = pick(rst.m, it.key);
      return badge(it.judgeStr ? it.judgeStr(cv) : "na") + (mode === "mini" ? "" : '<span class="ref">' + esc(it.ref) + "</span>");
    }
    if (it.phases || it.type === "grid") return mode === "mini" ? "" : '<span class="ref">' + it.ref + "</span>";
    var v2 = num(pick(rst.m, it.key));
    return badge(it.judge ? it.judge(v2) : "na") + (mode === "mini" ? "" : '<span class="ref">' + it.ref + "</span>");
  }
  return "";
}

   ========================================================================= */
function statusLabel(s) { return { ok: "良", warn: "要注意", ng: "不良", na: "—", ref: "参考値" }[s] || "—"; }
function siteToText(s) {
  var L = [];
  L.push("■ " + (s.name || "（無題の現場）"));
  L.push("点検日: " + (s.date || "-") + " / 種別: " + s.type + " / 受電電圧: " + (s.voltage || "-"));
  if (s.ground.length) {
    L.push(""); L.push("【接地抵抗】");
    s.ground.forEach(function (r) {
      var j = judgeGround(r);
      L.push("・" + (r.name || "-") + " : " + (r.value === "" || r.value === undefined ? "未測定" : r.value + "Ω") +
        "  [" + statusLabel(j.s) + "] 基準:" + j.ref + (r.method ? " / " + r.method : "") +
        (has(r.gv) ? " / 地電圧 " + r.gv + "V" : "") + (r.note ? " / " + r.note : ""));
    });
  }
  if (s.hv.length) {
    L.push(""); L.push("【高圧絶縁抵抗】");
    s.hv.forEach(function (r) {
      var head = "・" + placeLabel(r.place) + " " + r.method + "方式 " + r.side + " 3線一括 : ";
      var ws = hvSteps(r);   // 危険ケーブルは5kVのみ
      var parts = ws.map(function (w) {
        var j = judgeHv(s, r, w), v = hvVal(r, w);
        return (r.method === "E" ? hvKvLabel(w) + " " : "") +
          (v === "" || v === undefined ? "未測定" : v + (r.unit || "")) + " [" + statusLabel(j.s) + "]";
      });
      var wr = (r.method === "E" && r.place !== "sheath") ? weakRatio(s, r) : NaN;
      L.push(head + parts.join(" / ") +
        (dangerOn(r) ? " ※危険ケーブル（5kVのみ・弱点比算出不可）" + (has(r.v10) ? "／10kV記録値 " + r.v10 + (r.unit || "") + "（判定除外）" : "") : "") +
        (isNaN(wr) ? "" : " 弱点比" + fmt(wr, 2)) +
        (r.leak ? " ※リーク音・キックあり" : "") + (r.note ? " / " + r.note : ""));
    });
  }
  if (s.relays.length) {
    var kind = testKind(s);
    L.push(""); L.push("【継電器試験】（" + kind + "）");
    s.relays.forEach(function (r) {
      L.push("◆ " + relayTitle(r.type) + (r.label ? "（" + r.label + "）" : ""));
      var sf = relaySettingFields(r.type, kind).map(function (f) {
        var v = pick(relayStore(r, kind).s, f.k); return (v === undefined || v === "") ? null : f.l + "=" + v;
      }).filter(Boolean);
      if (sf.length) L.push("  整定: " + sf.join(" / "));
      relayItems(r, kind).forEach(function (it) {
        if (it.phases) {
          ["R", "T"].forEach(function (p) {
            var v = pick(relayStore(r, kind).m, it.key + p);
            L.push("  " + it.label + " " + p + "相: " + (v === undefined || v === "" ? "未測定" : v) +
              "  [" + statusLabel(it.judge(num(v))) + "]");
          });
          L.push("    基準: " + it.ref);
        } else if (it.type === "select") {
          var cv = pick(relayStore(r, kind).m, it.key);
          L.push("  " + it.label + ": " + (cv || "未実施") + "  [" + statusLabel(it.judgeStr(cv)) + "] 基準: " + it.ref);
        } else {
          var v2 = pick(relayStore(r, kind).m, it.key);
          L.push("  " + it.label + ": " + (v2 === undefined || v2 === "" ? "未測定" : v2) +
            "  [" + statusLabel(it.judge(num(v2))) + "] 基準: " + it.ref);
        }
      });
      if (r.note) L.push("  メモ: " + r.note);
    });
  }
  var bs = (s.bClamp || []).filter(function (c) { return has(c.igr) || has(c.io); });
  if (bs.length || s.lv.length) {
    L.push(""); L.push("【低圧絶縁・漏えい電流】");
    bs.forEach(function (c) {
      L.push("・B種クランプ " + (c.name || "-") + " : Igr=" + (c.igr || "-") + "mA  [" + statusLabel(judgeLeak(c.igr).s) + "]" +
        (has(c.io) ? " / Io=" + c.io + "mA" : "") + (c.note ? " / " + c.note : ""));
    });
    s.lv.forEach(function (r) {
      var j = judgeLv(r), k = judgeLeak(r.leak);
      L.push("・" + (r.name || "-") + " (" + r.cls + ") : 絶縁 " + (r.ir === "" || r.ir === undefined ? "未測定" : r.ir + "MΩ") +
        " [" + statusLabel(j.s) + "] / 漏えい " + (r.leak === "" || r.leak === undefined ? "未測定" : r.leak + "mA") +
        " [" + statusLabel(k.s) + "]" + (r.note ? " / " + r.note : ""));
    });
  }
  if (s.memo && s.memo.trim()) { L.push(""); L.push("【自由メモ】"); L.push(s.memo.trim()); }
  L.push(""); L.push("※判定は補助機能です。最終判断は技術者が行ってください。");
  return L.join("\n");
}

function modal(html) {
  var d = document.createElement("div");
  d.className = "mask";
  d.innerHTML = '<div class="modal">' + html + "</div>";
  d.addEventListener("click", function (e) { if (e.target === d) close(); });
  function close() { if (d.parentNode) d.parentNode.removeChild(d); }
  d._close = close;
  document.body.appendChild(d);
  return d;
}
function openNewSite() {
  var opts = sortedSites().map(function (s) { return '<option value="' + s.id + '">' + esc(s.name || "無題") + "（" + esc(s.date) + "）</option>"; }).join("");
  var m = modal('<h2>新規現場</h2>' +
    '<div class="field"><label>現場名</label><input class="in" id="nsName" placeholder="○○ビル キュービクル"></div>' +
    '<div class="row"><div class="field"><label>点検日</label><input class="in" type="date" id="nsDate" value="' + today() + '"></div>' +
    '<div class="field"><label>種別</label><select id="nsType">' + SITE_TYPES.map(function (t) { return "<option" + (t === "年次" ? " selected" : "") + ">" + t + "</option>"; }).join("") + "</select></div></div>" +
    '<div class="field"><label>試験種別（継電器タブの様式が切り替わります）</label><select id="nsKind">' +
      TEST_KINDS.map(function (k) { return "<option>" + k + "</option>"; }).join("") + "</select></div>" +
    '<div class="field"><label>受電電圧</label><input class="in" id="nsVolt" value="6600V"></div>' +
    (opts ? '<div class="field"><label>既存現場から項目・整定値を引き継ぐ（任意）</label><select id="nsCopy"><option value="">引き継がない</option>' + opts + "</select></div>" : "") +
    '<div class="btnrow"><button class="btn" id="nsCancel">キャンセル</button><button class="btn primary" id="nsOk">作成</button></div>');
  m.querySelector("#nsCancel").onclick = m._close;
  m.querySelector("#nsOk").onclick = function () {
    var s = newSite(m.querySelector("#nsName").value.trim());
    s.date = m.querySelector("#nsDate").value || today();
    s.type = m.querySelector("#nsType").value;
    s.testKind = m.querySelector("#nsKind").value;
    s.voltage = m.querySelector("#nsVolt").value;
    var cid = m.querySelector("#nsCopy") ? m.querySelector("#nsCopy").value : "";
    if (cid) {
      var src = db.sites.filter(function (x) { return x.id === cid; })[0];
      if (src) {
        s.ground = src.ground.map(function (r) { var c = JSON.parse(JSON.stringify(r)); c.id = uid(); c.value = ""; c.gv = ""; c.note = ""; return c; });
        s.hv = src.hv.map(function (r) { var c = JSON.parse(JSON.stringify(r)); c.id = uid(); c.value = ""; c.v10 = ""; c.leak = false; c.wrManual = ""; c.note = ""; return c; });
        s.lv = src.lv.map(function (r) { var c = JSON.parse(JSON.stringify(r)); c.id = uid(); c.ir = ""; c.leak = ""; c.note = ""; return c; });
        s.relays = src.relays.map(function (r) {
          var c = JSON.parse(JSON.stringify(r)); c.id = uid();
          TEST_KINDS.forEach(function (k) { relayStore(c, k).m = {}; });  // 整定値は引き継ぎ、測定値だけ空にする
          return c;
        });
        if (!s.name) s.name = src.name;
      }
    }
    db.sites.push(s); save(); m._close();
    ui.siteId = s.id; ui.screen = "site"; ui.tab = "ground"; render();
  };
  setTimeout(function () { var i = m.querySelector("#nsName"); if (i) i.focus(); }, 50);
}
function copyText(text, ta) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast("コピーしました"); }, function () { legacy(); });
  } else legacy();
  function legacy() {
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, 999999); document.execCommand("copy"); toast("コピーしました"); }
    catch (e) { toast("コピーできませんでした。長押しで選択してください"); }
  }
}
function openExportText() {
  var s = site(); if (!s) return;
  var t = siteToText(s);
  var m = modal("<h2>テキスト書き出し</h2>" +
    '<textarea id="exTa" style="min-height:300px;font-size:13px">' + esc(t) + "</textarea>" +
    '<div class="btnrow" style="margin-top:10px"><button class="btn" id="exClose">閉じる</button>' +
    '<button class="btn primary" id="exCopy">全文をコピー</button></div>');
  m.querySelector("#exClose").onclick = m._close;
  m.querySelector("#exCopy").onclick = function () { copyText(t, m.querySelector("#exTa")); };
}
function exportJson() {
  var data = JSON.stringify({ app: "hoan", version: 1, exported: new Date().toISOString(), sites: db.sites }, null, 2);
  var name = "hoan-backup-" + today() + ".json";
  try {
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
    toast("エクスポートしました");
  } catch (e) {
    var m = modal("<h2>JSON（手動コピー）</h2><textarea id=\"jTa\" style=\"min-height:300px;font-size:12px\">" + esc(data) + "</textarea>" +
      '<div class="btnrow" style="margin-top:10px"><button class="btn" id="jC">閉じる</button><button class="btn primary" id="jK">コピー</button></div>');
    m.querySelector("#jC").onclick = m._close;
    m.querySelector("#jK").onclick = function () { copyText(data, m.querySelector("#jTa")); };
  }
}
function importJson() {
  var m = modal("<h2>JSONインポート</h2>" +
    '<div class="field"><label>ファイルを選択</label><input class="in" type="file" id="imF" accept="application/json,.json"></div>' +
    '<div class="field"><label>またはJSONを貼り付け</label><textarea id="imT" style="min-height:140px;font-size:12px"></textarea></div>' +
    '<div class="field"><label>取り込み方法</label><select id="imMode">' +
    '<option value="merge">追加（同じIDは上書き）</option><option value="replace">全置換（現在のデータを破棄）</option></select></div>' +
    '<div class="btnrow"><button class="btn" id="imC">キャンセル</button><button class="btn primary" id="imOk">取り込む</button></div>');
  m.querySelector("#imC").onclick = m._close;
  m.querySelector("#imF").onchange = function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { m.querySelector("#imT").value = String(fr.result); };
    fr.readAsText(f);
  };
  m.querySelector("#imOk").onclick = function () {
    var raw = m.querySelector("#imT").value.trim();
    if (!raw) { toast("データがありません"); return; }
    var o; try { o = JSON.parse(raw); } catch (e) { alert("JSONの形式が不正です: " + e.message); return; }
    var arr = Array.isArray(o) ? o : (o && Array.isArray(o.sites) ? o.sites : null);
    if (!arr) { alert("sites 配列が見つかりません"); return; }
    var mode = m.querySelector("#imMode").value;
    if (mode === "replace") {
      if (!confirm("現在の " + db.sites.length + " 件を破棄して置き換えます。よろしいですか？")) return;
      db.sites = arr.map(normalizeSite);
    } else {
      arr.map(normalizeSite).forEach(function (s) {
        var i = db.sites.findIndex(function (x) { return x.id === s.id; });
        if (i >= 0) db.sites[i] = s; else db.sites.push(s);
      });
    }
    save(); m._close(); toast("取り込みました（" + arr.length + "件）"); render();
  };
}
function normalizeSite(s) {
  var o = newSite();
  o.id = s.id || uid(); o.name = s.name || ""; o.voltage = s.voltage || ""; o.date = s.date || "";
  o.type = SITE_TYPES.indexOf(s.type) >= 0 ? s.type : "年次"; o.created = s.created || Date.now();
  o.ground = Array.isArray(s.ground) ? s.ground : []; o.hv = Array.isArray(s.hv) ? s.hv : [];
  o.relays = Array.isArray(s.relays) ? s.relays : []; o.lv = Array.isArray(s.lv) ? s.lv : [];
  o.bClamp = s.bClamp; o.memo = s.memo || ""; migrateSite(o);
  o.ground.forEach(function (r) { if (!r.id) r.id = uid(); });
  o.hv.forEach(function (r) { if (!r.id) r.id = uid(); });
  o.relays.forEach(function (r) { if (!r.id) r.id = uid(); if (!r.s) r.s = {}; if (!r.m) r.m = {}; });
  o.lv.forEach(function (r) { if (!r.id) r.id = uid(); });
  return o;
}

/* =========================================================================
   11. イベント
   ========================================================================= */
function setBind(path, value) {
  var s = site();
  var p = path.split(":");
  if (p[0] === "site") { if (!s) return; s[p[1]] = value; }
  else if (p[0] === "bclamp") {
    if (!s) return;
    var c = (s.bClamp || []).filter(function (x) { return x.id === p[1]; })[0];
    if (c) c[p[2]] = value;
  }
  else if (p[0] === "relay") {
    var r = s.relays.filter(function (x) { return x.id === p[1]; })[0]; if (!r) return;
    // s./m. は試験種別ごとの領域へ、それ以外（label・note）は種別共通で継電器本体へ
    if (/^[sm]\./.test(p[2])) put(relayStore(r, testKind(s)), p[2], value);
    else put(r, p[2], value);
  } else {
    var arr = s[p[0] === "ground" ? "ground" : p[0]];
    var row = arr.filter(function (x) { return x.id === p[1]; })[0]; if (!row) return;
    row[p[2]] = value;
    if (p[0] === "ground" && p[2] === "bBaseLabel") row.bBase = CRITERIA.ground.bBases[value] || "";
  }
  save();
}
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.act === "search") { ui.q = t.value; var pos = t.selectionStart; render();
    var i = app.querySelector('[data-act="search"]'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (!t.dataset || !t.dataset.bind) return;
  setBind(t.dataset.bind, t.type === "checkbox" ? t.checked : t.value);
  refreshJudge();
});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (!t.dataset || !t.dataset.bind) return;
  setBind(t.dataset.bind, t.type === "checkbox" ? t.checked : t.value);
  // select変更で表示項目自体が変わるものは再描画
  var b = t.dataset.bind;
  if (/:(kind|place|method|side|unit|danger|cls|type)$/.test(b) || /:s\.link$/.test(b) ||
      b === "site:type" || b === "site:testKind") render();
  else refreshJudge();
});
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act, s = site();
  if (act === "nav") { ui.screen = b.dataset.screen; render(); window.scrollTo(0, 0); return; }
  if (act === "open") {
    ui.siteId = b.dataset.id; ui.screen = "site"; ui.tab = "ground"; ui.open = {};
    var os = site(); ui.openHeader = !(os && os.name);
    render(); window.scrollTo(0, 0); return;
  }
  if (act === "newsite") { openNewSite(); return; }
  if (act === "expand") { var eid = b.dataset.id; ui.open[eid] = !ui.open[eid]; render(); return; }
  if (act === "expand-header") { ui.openHeader = !ui.openHeader; render(); return; }
  if (act === "delsite") {
    var dsid = b.dataset.id, ds = db.sites.filter(function (x) { return x.id === dsid; })[0];
    if (!ds) return;
    if (!confirm("「" + (ds.name || "無題の現場") + "（" + (ds.date || "日付なし") + "）」を削除します。取り消せません。よろしいですか？")) return;
    db.sites = db.sites.filter(function (x) { return x.id !== dsid; });
    save();
    if (ui.siteId === dsid) { ui.siteId = null; ui.screen = "home"; }
    render(); toast("削除しました"); return;
  }
  if (act === "tab") { ui.tab = b.dataset.tab; render(); return; }
  if (act === "goref") { ui.screen = "ref"; ui.refJump = b.dataset.ref; render(); return; }
  if (act === "export-text") { openExportText(); return; }
  if (act === "export-json") { exportJson(); return; }
  if (act === "import-json") { importJson(); return; }
  if (act === "reload") { if ("serviceWorker" in navigator) { navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.update(); }); setTimeout(function () { location.reload(); }, 400); }); } else location.reload(); return; }
  if (act === "wipe") {
    if (!confirm("全ての現場データを削除します。取り消せません。続けますか？")) return;
    if (!confirm("本当に削除します。エクスポートは済んでいますか？")) return;
    db.sites = []; save(); ui.screen = "home"; render(); toast("全データを削除しました"); return;
  }
  if (!s) return;
  if (act === "add") {
    var c = b.dataset.cat;
    if (c === "ground") s.ground.push(newGround("", "A"));
    if (c === "hv") s.hv.push(newHv("cable", "E", "電源側"));
    if (c === "lv") s.lv.push({ id: uid(), name: "", cls: "150V以下", ir: "", leak: "", note: "" });
    save(); render(); return;
  }
  if (act === "del") {
    if (!confirm("この項目を削除しますか？")) return;
    var cat = b.dataset.cat, id = b.dataset.id;
    s[cat] = s[cat].filter(function (x) { return x.id !== id; });
    save(); render(); return;
  }
  if (act === "tmpl-ground") {
    defaultGround().forEach(function (g) { s.ground.push(g); });
    save(); render(); return;
  }
  if (act === "tmpl-hv") {
    defaultHv().forEach(function (h) { s.hv.push(h); });
    save(); render(); return;
  }
  if (act === "add-clamp") {
    if (!Array.isArray(s.bClamp)) migrateSite(s);
    s.bClamp.push(newClamp(b.dataset.name || ""));
    save(); render(); return;
  }
  if (act === "addrelay") {
    var sel = document.getElementById("relayAdd"); if (!sel) return;
    s.relays.push(newRelay(sel.value));
    save(); render(); return;
  }
  if (act === "loadpreset") {
    var r = s.relays.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!r) return;
    var p = prevSite(s);
    if (!p) { toast("同じ現場名の過去記録がありません"); return; }
    var src = p.relays.filter(function (x) { return x.type === r.type; })[0];
    if (!src) { toast("前回に同じ種別の継電器がありません"); return; }
    var k = testKind(s);
    relayStore(r, k).s = JSON.parse(JSON.stringify(relayStore(src, k).s));
    if (!r.label) r.label = src.label || "";
    save(); render(); toast("前回（" + p.date + "）" + k + "の整定値を読み込みました"); return;
  }
});

/* =========================================================================
   12. 起動
   ========================================================================= */
load();
render();
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("SW登録失敗", e); });
  });
}
</script>
